name: Build KernelSU Kernel for alioth (4.19 non-GKI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout repo (for build scripts)
        uses: actions/checkout@v4

      - name: Clone kernel source (alioth-r-oss) + AnyKernel3
        run: |
          git clone --depth=1 -b alioth-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # 必需包 (24.04 兼容, 去掉 libncurses5 等已移除包)
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            imagemagick libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 cpio kmod device-tree-compiler unzip wget libelf-dev
          # 可选/可能缺失的包容错安装
          sudo apt-get install -y g++-multilib gcc-multilib lib32z1-dev python2.7 || true

      - name: Ensure python2 (Qualcomm gcc-wrapper.py)
        run: |
          sudo apt-get install -y python2.7 || true
          if command -v python2.7 >/dev/null 2>&1; then sudo ln -sf "$(command -v python2.7)" /usr/local/bin/python2; fi
          python2 --version 2>&1 || echo "python2 absent (will patch wrapper to py3)"

      - name: Fetch toolchains
        run: |
          mkdir -p tc && cd tc
          # gcc 工具链(clone, 重试)
          for i in 1 2 3; do git clone --depth=1 -b gcc-master https://github.com/mvaisakh/gcc-arm64.git gcc-arm64 && break || sleep 5; done
          for i in 1 2 3; do git clone --depth=1 -b gcc-master https://github.com/mvaisakh/gcc-arm.git gcc-arm && break || sleep 5; done
          # clang (带重试 + 完整性校验)
          mkdir -p clang
          ok=0
          for i in 1 2 3 4 5; do
            curl -fL --retry 5 --retry-delay 8 -C - "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz" -o clang.tar.gz
            if gzip -t clang.tar.gz 2>/dev/null; then ok=1; break; fi
            echo "clang tar corrupt, retry $i"; rm -f clang.tar.gz; sleep 8
          done
          [ "$ok" = "1" ] || { echo "FAILED to fetch clang"; exit 1; }
          tar xzf clang.tar.gz -C clang
          ls clang/bin/clang

      - name: Integrate KernelSU (v0.9.5 non-GKI)
        run: |
          cd kernel
          wget -q "https://cdn.jsdelivr.net/gh/tiann/KernelSU@v0.9.5/kernel/setup.sh" -O /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh v0.9.5
          grep -n kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -n kernelsu drivers/Makefile
          grep -n kernelsu drivers/Kconfig

      - name: Build Image
        run: |
          cd kernel
          export ARCH=arm64 SUBARCH=arm64
          TOOL="$(pwd)/../tc"
          CLANG="$TOOL/clang/bin"
          G="$TOOL/gcc-arm64/bin"
          mkdir -p "$TOOL/gccbin"
          for t in as ar nm objcopy objdump strip ranlib; do
            ln -sf "$G/aarch64-elf-$t" "$TOOL/gccbin/aarch64-linux-gnu-$t"
          done
          ln -sf "$CLANG/ld.lld" "$TOOL/gccbin/aarch64-linux-gnu-ld"
          export PATH="$CLANG:$TOOL/gccbin:$PATH"
          python3 ../build/fix_wrapper.py scripts/gcc-wrapper.py
          make -j"$(nproc)" O=out ARCH=arm64 vendor/alioth_user_defconfig
          grep -q CONFIG_KSU out/.config || echo 'CONFIG_KSU=y' >> out/.config
          # 关 MODVERSIONS: lld 下 __crc_ 符号 R_AARCH64_ABS32 relocation 报错的标准解法
          scripts/config --file out/.config -d MODVERSIONS
          scripts/config --file out/.config -d MODULE_SIG -d MODULE_SIG_ALL || true
          make O=out ARCH=arm64 olddefconfig
          grep -i '^CONFIG_KSU=' out/.config
          grep -i '^CONFIG_MODVERSIONS' out/.config || echo "MODVERSIONS disabled"
          # -fno-builtin-stpcpy: 防止新clang把strcpy替换成内核没有的stpcpy
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$TOOL/gccbin/aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="$TOOL/gcc-arm/bin/arm-eabi-" \
            LD="ld.lld" \
            AR="$TOOL/gccbin/aarch64-linux-gnu-ar" \
            NM="$TOOL/gccbin/aarch64-linux-gnu-nm" \
            OBJCOPY="$TOOL/gccbin/aarch64-linux-gnu-objcopy" \
            OBJDUMP="$TOOL/gccbin/aarch64-linux-gnu-objdump" \
            STRIP="$TOOL/gccbin/aarch64-linux-gnu-strip" \
            KCFLAGS="-fno-builtin-stpcpy" \
            HOSTCFLAGS="-fcommon" \
            Image
          IMG="$(find out -name Image | head -1)"
          echo "IMG=$IMG"
          ls -la "$IMG"
          cp "$IMG" ../ak3/Image

      - name: Package with AnyKernel3
        run: |
          cd ak3
          sed -i 's/^kernel.string=.*/kernel.string=alioth-KernelSU/' anykernel.sh || true
          if grep -q 'device.name1' anykernel.sh; then sed -i 's/device.name1=.*/device.name1=alioth/' anykernel.sh; else echo 'device.name1=alioth' >> anykernel.sh; fi
          zip -r9 ../alioth-KernelSU-kernel.zip * -x .git README.md '*placeholder' .github
          ls -la ../alioth-KernelSU-kernel.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alioth-KernelSU-kernel
          path: alioth-KernelSU-kernel.zip

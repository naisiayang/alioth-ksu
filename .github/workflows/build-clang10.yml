name: Build KernelSU alioth (clang10 stock-config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel + AnyKernel3
        run: |
          git clone --depth=1 -b alioth-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
            imagemagick libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 cpio kmod device-tree-compiler unzip wget python2 python-is-python2

      - name: Fetch AOSP clang 10.0.7 + aarch64 gcc binutils
        run: |
          mkdir -p tc && cd tc
          # clang 10.0.7 = r365631c (android-10)
          ok=0
          for tag in android-10.0.0_r30 android-10.0.0_r1; do
            for ver in clang-r365631c clang-r353983c; do
              echo "try $tag/$ver"
              if curl -fL --retry 3 -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/$tag/$ver.tar.gz"; then
                if gzip -t clang.tar.gz 2>/dev/null; then ok=1; break 2; fi
              fi
            done
          done
          [ "$ok" = "1" ] || { echo "clang download failed"; exit 1; }
          mkdir clang && tar xzf clang.tar.gz -C clang
          clang/bin/clang --version | head -1
          echo "CLANGDIR=$(pwd)/clang" >> $GITHUB_ENV
          # aarch64 gcc (binutils + gcc for kernel build, glibc-compatible on 20.04)
          git clone --depth=1 -b gcc-master https://github.com/mvaisakh/gcc-arm64.git gcc-arm64
          git clone --depth=1 -b gcc-master https://github.com/mvaisakh/gcc-arm.git gcc-arm
          echo "GCC64=$(pwd)/gcc-arm64/bin" >> $GITHUB_ENV
          echo "GCC32=$(pwd)/gcc-arm/bin" >> $GITHUB_ENV

      - name: Integrate KernelSU
        run: |
          cd kernel
          wget -q "https://cdn.jsdelivr.net/gh/tiann/KernelSU@v0.9.5/kernel/setup.sh" -O /tmp/s.sh
          bash /tmp/s.sh v0.9.5
          grep -n kernelsu drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -n "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Build with clang 10.0.7 + stock config
        run: |
          cd kernel
          export ARCH=arm64 SUBARCH=arm64
          export PATH="$CLANGDIR/bin:$GCC64:$GCC32:$PATH"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/configs/original_defconfig" out/.config
          grep -q CONFIG_KSU out/.config || echo 'CONFIG_KSU=y' >> out/.config
          make O=out ARCH=arm64 olddefconfig
          grep -i '^CONFIG_KSU=' out/.config
          grep -i '^CONFIG_MODVERSIONS=' out/.config
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$GCC64/aarch64-elf-" \
            CROSS_COMPILE_ARM32="$GCC32/arm-eabi-" \
            LD="$GCC64/aarch64-elf-ld" \
            AR="$GCC64/aarch64-elf-ar" \
            NM="$GCC64/aarch64-elf-nm" \
            OBJCOPY="$GCC64/aarch64-elf-objcopy" \
            OBJDUMP="$GCC64/aarch64-elf-objdump" \
            STRIP="$GCC64/aarch64-elf-strip" \
            HOSTCFLAGS="-fcommon" \
            Image
          IMG="$(find out -name Image | head -1)"
          echo "IMG=$IMG"; ls -la "$IMG"
          cp "$IMG" ../ak3/Image

      - name: Package AnyKernel3
        run: |
          cd ak3
          printf '%s\n' "properties() { '" "kernel.string=alioth-KernelSU" "do.devicecheck=1" "device.name1=alioth" "'; }" "BLOCK=/dev/block/by-name/boot;" "IS_SLOT_DEVICE=1;" ". tools/ak3-core.sh;" "write_boot;" > anykernel.sh
          zip -r9 ../alioth-KernelSU-kernel.zip * -x .git README.md '*placeholder' .github
          ls -la ../alioth-KernelSU-kernel.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: alioth-KernelSU-clang10
          path: |
            alioth-KernelSU-kernel.zip
            ak3/Image
